<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Falcon processor icons</title>
<style>
@font-face {
  font-family: "Inter";
  src: url("Inter-VariableFont_opsz,wght.ttf") format("truetype");
  font-weight: 100 900;
}
:root {
  --page: #f6fbf3;
  --card: #ffffff;
  --ink: #0d1a12;
  --muted: #5a665d;
  --line: #d5ddd3;
  --accent: #145431;
  --accent-ink: #ffffff;
  --reject: #a3271f;
  --reject-ink: #ffffff;
  --icon-stroke: 1;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --page: #0f1511;
  --card: #161d18;
  --ink: #e3ebe2;
  --muted: #93a096;
  --line: #2a342c;
  --accent: #95d5a7;
  --accent-ink: #00341a;
  --reject: #f2a59b;
  --reject-ink: #4a0d08;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font: 14px/1.45 Inter, system-ui, sans-serif;
}
button { font: inherit; color: inherit; cursor: pointer; }
.icon { stroke-width: var(--icon-stroke); display: block; }

.top {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 24px;
  padding: 12px 24px;
  background: var(--page);
  border-bottom: 1px solid var(--line);
}
.top h1 { margin: 0; font-size: 16px; font-weight: 700; }
.top p { margin: 0; color: var(--muted); }
.controls { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; }
.control { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
.segmented { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.segmented button { border: 0; background: var(--card); padding: 5px 10px; font-size: 12px; }
.segmented button + button { border-left: 1px solid var(--line); }
.segmented button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

main { max-width: 1120px; margin: 0 auto; padding: 0 24px 160px; }
.processor { padding: 26px 0; border-bottom: 1px solid var(--line); }
.processor h2 { margin: 0; font-size: 18px; font-weight: 700; }
.processor .what { margin: 2px 0 14px; color: var(--muted); }
.processor .note { color: var(--accent); font-weight: 600; }
.candidates { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 780px) { .candidates { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.candidate {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 18px 8px 12px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
}
button.candidate:hover { border-color: var(--muted); }
.candidate[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.sizes { display: flex; align-items: center; gap: 10px; }
.inverted { display: inline-flex; padding: 6px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); }
.caption { font-size: 12px; color: var(--muted); text-align: center; }
.caption b { color: var(--ink); margin-right: 4px; }

.processor.is-rejected .candidates { opacity: 0.4; }
.verdict { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 10px; margin-top: 12px; }
.reject {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--card);
  padding: 6px 12px;
  font-size: 12px;
  white-space: nowrap;
}
.reject:hover { border-color: var(--reject); color: var(--reject); }
.reject[aria-pressed="true"] { background: var(--reject); border-color: var(--reject); color: var(--reject-ink); }
.reason {
  flex: 1;
  min-width: 240px;
  padding: 6px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--card);
  color: var(--ink);
  font: inherit;
  resize: vertical;
}
.reason:focus { outline: 2px solid var(--reject); outline-offset: -1px; }

.picks {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 10px 24px;
  background: var(--card);
  border-top: 1px solid var(--line);
}
.picks .count { font-weight: 700; white-space: nowrap; }
.picks output {
  flex: 1;
  max-height: 6em;
  overflow-y: auto;
  white-space: pre-line;
  color: var(--muted);
  font-size: 12px;
  user-select: all;
}
.picks button { border: 1px solid var(--line); border-radius: 8px; background: var(--page); padding: 6px 12px; white-space: nowrap; }
</style>
</head>
<body>

<header class="top">
  <div>
    <h1>Falcon processor icons</h1>
    <p>Five candidates for each processor still open. Click one, or reject the row and say what to improve, then copy the picks from the bar below. The decided icons are listed under them.</p>
  </div>
  <div class="controls">
    <div class="control">Stroke
      <div class="segmented" data-control="stroke">
        <button type="button" data-value="1" aria-pressed="true">1</button>
        <button type="button" data-value="1.5" aria-pressed="false">1.5</button>
        <button type="button" data-value="1.75" aria-pressed="false">1.75</button>
        <button type="button" data-value="2" aria-pressed="false">2</button>
      </div>
    </div>
    <div class="control">Theme
      <div class="segmented" data-control="theme">
        <button type="button" data-value="light" aria-pressed="false">Light</button>
        <button type="button" data-value="dark" aria-pressed="false">Dark</button>
      </div>
    </div>
  </div>
</header>

<main id="brochure"></main>

<footer class="picks">
  <span class="count" id="pick-count"></span>
  <output id="pick-summary"></output>
  <button type="button" id="copy-picks">Copy picks</button>
</footer>

<script>
const processors = JSON.parse(document.getElementById('icon-data').textContent);
const brochure = document.getElementById('brochure');
const pickCount = document.getElementById('pick-count');
const pickSummary = document.getElementById('pick-summary');
const openProcessors = processors.filter((processor) => !processor.is_decided);
const picksKey = 'falcon-processor-icon-picks-round-3';
const reasonsKey = 'falcon-processor-icon-reject-reasons-round-3';
const rejected = 'rejected';

function readStored(key) {
  try {
    return JSON.parse(localStorage.getItem(key)) || {};
  } catch (error) {
    return {};
  }
}

const picks = readStored(picksKey);
// A reason outlives its row's rejection, so that rejecting the row again brings the text back.
const reasons = readStored(reasonsKey);

function iconSvg(body, size) {
  return `<svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="${size}" height="${size}" ` +
    `fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" ` +
    `aria-hidden="true">${body}</svg>`;
}

function iconAtEverySize(icon) {
  return `${iconSvg(icon.svg, 64)}
    <span class="sizes">
      ${iconSvg(icon.svg, 32)}${iconSvg(icon.svg, 24)}${iconSvg(icon.svg, 16)}
      <span class="inverted">${iconSvg(icon.svg, 24)}</span>
    </span>`;
}

function candidateHtml(processor, icon, iconIndex) {
  const number = iconIndex + 1;
  return `<button type="button" class="candidate" data-processor="${processor.name}" data-number="${number}" aria-pressed="false">
    ${iconAtEverySize(icon)}
    <span class="caption"><b>${number}</b>${icon.label}</span>
  </button>`;
}

function decidedHtml(processor) {
  const icon = processor.icons[0];
  const note = processor.note ? `<br><span class="note">${processor.note}</span>` : '';
  return `<div class="candidate is-decided">
    ${iconAtEverySize(icon)}
    <span class="caption"><b>${processor.name}</b><br>${icon.label}${note}</span>
  </div>`;
}

function decidedSectionHtml(decidedProcessors) {
  if (decidedProcessors.length === 0) {
    return '';
  }
  return `<section class="processor">
    <h2>Decided</h2>
    <p class="what">One icon each, with nothing to pick. Each is saved as icons/&lt;processor file name&gt;.svg.</p>
    <div class="candidates">${decidedProcessors.map(decidedHtml).join('')}</div>
  </section>`;
}

function verdictHtml(processor) {
  return `<div class="verdict">
    <button type="button" class="reject" aria-pressed="false">Reject all five</button>
    <textarea class="reason" rows="2" placeholder="What needs to be improved?" aria-label="What needs to be improved for ${processor.name}" hidden></textarea>
  </div>`;
}

function processorHtml(processor) {
  const note = processor.note ? ` <span class="note">${processor.note}</span>` : '';
  return `<section class="processor" data-processor="${processor.name}">
    <h2>${processor.name}</h2>
    <p class="what">${processor.what}${note}</p>
    <div class="candidates">${processor.icons.map((icon, iconIndex) => candidateHtml(processor, icon, iconIndex)).join('')}</div>
    ${verdictHtml(processor)}
  </section>`;
}

function isRejected(processorName) {
  return picks[processorName] === rejected;
}

function rejectionText(processor) {
  const reason = (reasons[processor.name] || '').replace(/\s+/g, ' ').trim();
  return reason ? `${processor.name} rejected: ${reason}` : `${processor.name} rejected`;
}

// The picks on one line, then one line for each rejected row.
function picksText() {
  const chosen = openProcessors
    .filter((processor) => Number.isInteger(picks[processor.name]))
    .map((processor) => `${processor.name} ${picks[processor.name]}`)
    .join(', ');
  const rejections = openProcessors
    .filter((processor) => isRejected(processor.name))
    .map(rejectionText);
  return [chosen, ...rejections].filter((line) => line !== '').join('\n');
}

function showPicks() {
  for (const candidate of brochure.querySelectorAll('.candidate')) {
    const isPicked = picks[candidate.dataset.processor] === Number(candidate.dataset.number);
    candidate.setAttribute('aria-pressed', String(isPicked));
  }
  for (const section of brochure.querySelectorAll('.processor[data-processor]')) {
    const isRowRejected = isRejected(section.dataset.processor);
    section.classList.toggle('is-rejected', isRowRejected);
    section.querySelector('.reject').setAttribute('aria-pressed', String(isRowRejected));
    section.querySelector('.reason').hidden = !isRowRejected;
  }
  const pickedCount = openProcessors.filter((processor) => Number.isInteger(picks[processor.name])).length;
  const rejectedCount = openProcessors.filter((processor) => isRejected(processor.name)).length;
  pickCount.textContent = `${pickedCount} picked, ${rejectedCount} rejected, of ${openProcessors.length}`;
  pickSummary.textContent = picksText() || 'Nothing picked yet.';
  try {
    localStorage.setItem(picksKey, JSON.stringify(picks));
    localStorage.setItem(reasonsKey, JSON.stringify(reasons));
  } catch (error) {
    // Picks then last only until the page closes.
  }
}

function setSegment(control, value) {
  for (const button of control.querySelectorAll('button')) {
    button.setAttribute('aria-pressed', String(button.dataset.value === value));
  }
}

brochure.innerHTML = openProcessors.map(processorHtml).join('') +
  decidedSectionHtml(processors.filter((processor) => processor.is_decided));
for (const section of brochure.querySelectorAll('.processor[data-processor]')) {
  section.querySelector('.reason').value = reasons[section.dataset.processor] || '';
}

brochure.addEventListener('click', (event) => {
  const rejectButton = event.target.closest('.reject');
  if (rejectButton) {
    const section = rejectButton.closest('.processor');
    const processorName = section.dataset.processor;
    if (isRejected(processorName)) {
      delete picks[processorName];
    } else {
      picks[processorName] = rejected;
    }
    showPicks();
    if (isRejected(processorName)) {
      section.querySelector('.reason').focus();
    }
    return;
  }
  const candidate = event.target.closest('button.candidate');
  if (!candidate) {
    return;
  }
  const processorName = candidate.dataset.processor;
  const number = Number(candidate.dataset.number);
  if (picks[processorName] === number) {
    delete picks[processorName];
  } else {
    picks[processorName] = number;
  }
  showPicks();
});

brochure.addEventListener('input', (event) => {
  const reason = event.target.closest('.reason');
  if (!reason) {
    return;
  }
  reasons[reason.closest('.processor').dataset.processor] = reason.value;
  showPicks();
});

document.querySelector('[data-control="stroke"]').addEventListener('click', (event) => {
  const button = event.target.closest('button');
  if (!button) {
    return;
  }
  document.documentElement.style.setProperty('--icon-stroke', button.dataset.value);
  setSegment(event.currentTarget, button.dataset.value);
});

const themeControl = document.querySelector('[data-control="theme"]');
function setTheme(theme) {
  document.documentElement.dataset.theme = theme;
  setSegment(themeControl, theme);
}
themeControl.addEventListener('click', (event) => {
  const button = event.target.closest('button');
  if (button) {
    setTheme(button.dataset.value);
  }
});
setTheme(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

document.getElementById('copy-picks').addEventListener('click', async (event) => {
  const button = event.currentTarget;
  try {
    await navigator.clipboard.writeText(picksText());
    button.textContent = 'Copied';
  } catch (error) {
    window.getSelection().selectAllChildren(pickSummary);
    button.textContent = 'Selected, press Ctrl+C';
  }
  setTimeout(() => {
    button.textContent = 'Copy picks';
  }, 2000);
});

showPicks();
</script>
</body>
</html>
