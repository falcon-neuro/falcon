name: Lint, format and compile

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop

jobs:
  build-linux:
    name: Lint, format and compile
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run CSpell spell checker
        uses: streetsidesoftware/cspell-action@v8
        with:
          # TODO(ben): enable strict checking once the codebase is cleaned
          strict: false

      - name: Install dependencies
        run: |
          sh scripts/setup/install_deps.sh
          sh scripts/setup/install_cmake.sh
          # GCC builds Falcon; LLVM brings the formatter, the linter and the clang that the
          # processors' list is read with.
          sh scripts/setup/install_llvm.sh
          sh scripts/setup/fetch_gcc.sh

      - name: Run clang-format
        run: |
          sh scripts/format.sh
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Following files seem to be not formatted. Please run './scripts/format.sh' locally and commit the changes."
            git --no-pager diff --name-only
            exit 1
          fi

      - name: Configure CMake
        run: |
          gcc_directory=$(sh scripts/setup/fetch_gcc.sh --where)/usr/bin
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=$gcc_directory/gcc-16 \
            -DCMAKE_CXX_COMPILER=$gcc_directory/g++-16

      - name: Build project
        run: |
          cd build
          make -j$(nproc)

      - name: Run clang-tidy
        run: |
          sh scripts/tidy.sh
